<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mock DuckDuckGo images SERP (2025) for Image Hunter checkbox test</title>
<style>
  body { font-family: sans-serif; margin: 20px; }
  /* ВАЖНО: разметка как в актуальной (2025) выдаче DDG:
     1) плитка — SECTION > OL > LI > OL > LI > FIGURE > DIV > IMG;
     2) классы хешированные, ITEM_SEL их не знает (tile--img больше нет);
     3) якорей внутри плитки нет — обработчик клика вешается JS-ом DDG;
     4) «оригиналы» в u= прокси — кеш tse*.mm.bing.net/th/id/… БЕЗ
        расширения файла, looksImage() такие URL раньше отбрасывал. */
  section > ol { list-style: none; padding: 0; }
  section ol ol { list-style: none; padding: 0; margin: 0; }
  figure { margin: 8px; width: 200px; height: 160px; border: 1px solid #ccc;
           overflow: hidden; position: relative; }
  figure img { width: 100%; height: 100%; object-fit: cover; }
</style>
</head>
<body>
  <section>
    <ol class="f7hWyMHaNjO2grO9HbyD">
      <li>
        <ol class="NsCLmRPk79Yvia9NrTjn">
          <li>
            <!-- плитка 1: оригинал — кеш Bing без расширения (типично для DDG) -->
            <figure class="nsogf_Hpj9UUxfhcwQd5">
              <div class="SZ76bwIlqO8BBoqOLqYV">
                <img src="https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Ftse1.mm.bing.net%2Fth%2Fid%2FOIP.a1b2c3%3Fpid%3DImgDet%26w%3D474%26h%3D474" alt="1">
              </div>
            </figure>
          </li>
        </ol>
      </li>
      <li>
        <ol>
          <li>
            <!-- плитка 2: обычный оригинал с расширением .jpg -->
            <figure class="nSogF_Hpj9UUxfhcwQd5x">
              <div class="sZ76bwIlqO8BBoqOLqYVy">
                <img src="https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Fddgsite-two.com%2Fpic2.jpg&amp;f=1&amp;noexp=1" alt="2">
