<!doctype html>
<!-- Мок выдачи внутри фрейма Mail.ru: обычные плитки Яндекса
     (serp-item + img_url в параметрах ссылки + data-bem с origUrl). -->
<html lang="ru">
<body>
<div class="serp-list">
  <div class="serp-item" id="tile1">
    <a class="Link" href="https://yandex.ru/images/search?pos=0&amp;img_url=https%3A%2F%2Fexample.org%2Fframe1.jpg&amp;rpt=simage">
      <img src="https://avatars.mds.yandex.net/get-mpic/700/frame_thumb1.jpg" alt="1">
    </a>
  </div>
  <div class="serp-item" id="tile2" data-bem='{"serp-item":{"origUrl":"https://avatars.mds.yandex.net/get-mpic/800/frame_orig2/orig","img_url":"https://example.org/frame2.jpg"}}'>
    <a class="Link" href="https://yandex.ru/images/search?pos=1&amp;img_url=https%3A%2F%2Fexample.org%2Fframe2.jpg&amp;rpt=simage">
      <img src="https://avatars.mds.yandex.net/get-mpic/800/frame_thumb2.jpg" alt="2">
    </a>
  </div>
</div>
</body>
</html>
